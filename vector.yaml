api: {enabled: true}
sources:
  cluster: {type: vector, address: '[::]:6000'}

  logs:
    type: nats
    url: "nats://[fdaa::3]:4223"
    subject: 'logs.>'
    auth: {strategy: user_password, user_password: {user: "${ORG-personal}", password: "${ACCESS_TOKEN?}"}}
    connection_name: Fly logs stream
    queue: "${FLY_APP_NAME}"
    decoding:
      codec: vrl
      vrl:
        source: |
          . = parse_json!(.message)
          # Guard the merge: an app line that is valid JSON of a NON-object
          # (bare string/number/array) made merge! abort and DROP the frame —
          # observed live as vector "Failed deserializing frame ... expected
          # object, got string" errors. Non-object lines now keep flowing
          # with the raw line left in .message.
          parsed = parse_json(.message) ?? {}
          if is_object(parsed) {
            . = merge!(., parsed)
          }

  metrics:
    type: nats
    url: "nats://[fdaa::3]:4223"
    subject: 'metrics.>'
    auth: {strategy: user_password, user_password: {user: "${ORG-personal}", password: "${ACCESS_TOKEN?}"}}
    connection_name: Fly metrics stream
    queue: "${FLY_APP_NAME}"
    decoding:
      codec: vrl
      vrl:
        source: |
          metric = array!(parse_json!(decode_zstd(.message) ?? "[]"))
          for_each(metric) -> |_idx, val| {val.timestamp = parse_timestamp!(val.timestamp, "%+")}
          . = metric

  local:
    type: prometheus_scrape
    endpoint_tag: process
    endpoints:
      - http://localhost:8428/metrics
      - http://localhost:9428/metrics
      - http://localhost:10428/metrics
      - http://localhost:80/metrics

transforms:
  # https://github.com/vectordotdev/vector/issues/20494
  metrics_fix:
    type: remap
    inputs: [metrics]
    source: |
      if exists(.aggregated_histogram) { .histogram = del(.aggregated_histogram) }
      if exists(.aggregated_summary)   { .summary   = del(.aggregated_summary)   }
  platform-metrics:
    type: log_to_metric
    inputs: [metrics_fix]
    all_metrics: true
    metrics: []

  local-metrics:
    type: remap
    inputs: [local]
    source: |
      .tags.app      = "$FLY_APP_NAME"
      .tags.instance = "$FLY_MACHINE_ID"
      .tags.region   = "$FLY_REGION"
      process = parse_url(.tags.process) ?? {}
      if process.port == 8428 { .tags.process = "metrics" }
      if process.port == 9428 { .tags.process = "logs" }
      if process.port == 10428 { .tags.process = "traces" }
      if process.port == 80 { .tags.process = "grafana" }

  cluster-route:
    type: route
    inputs: [cluster]
    route: {logs: {type: is_log}, metrics: {type: is_metric}}

sinks:
  metrics_db:
    inputs: ['*-metrics', cluster-route.metrics]
    type: prometheus_remote_write
    endpoint: 'http://localhost:8428/prometheus/api/v1/write'
    healthcheck: {enabled: false}
    batch: {aggregate: false}

  logs_db:
    inputs: ['logs', cluster-route.logs]
    type: elasticsearch
    endpoints: ['http://localhost:9428/insert/elasticsearch/']
    api_version: v8
    compression: gzip
    healthcheck: {enabled: false}
    query:
      _msg_field: message
      _time_field: timestamp
      # `logger` separates HTTP request/response logs (logger=http, set by each
      # service's winston defaultMeta) from regular app logs at the STREAM level,
      # so Grafana can query either without seeing the other. Low-cardinality by
      # convention: http | app | (absent). Audit events are level=audit
      # WITHIN the app stream, not their own stream.
      # `runtime` (node | bun | dotnet) is a STREAM field, not a per-line field:
      # it is constant per service, so it costs nothing per line here while
      # letting Grafana group the fleet by runtime. Absent on services still on
      # older package versions — harmless (empty for those streams).
      _stream_fields: region,host,fly.app.name,fly.app.instance,logger,runtime
