# Throwaway smoke-test app. Created on the org's `production` network so it
# can reach bhgrafana.flycast; flycast-only (no public IPs); destroyed after
# the test run.
app = "bh-telemetry-smoke"
primary_region = "sin"

[env]
  NODE_OPTIONS = "--import @insidebeehive/telemetry/register"
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://bhgrafana.flycast:10428/insert/opentelemetry"
  OTEL_TRACES_SAMPLER_ARG = "1"       # sample everything for the smoke test
  DEPLOYMENT_ENVIRONMENT = "smoke"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
