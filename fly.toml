# Single-machine telemetry stack: Vector + VictoriaMetrics + VictoriaLogs +
# VictoriaTraces + Grafana (see start.sh). Built from the local Dockerfile —
# clone with submodules before deploying (dashboards/ is a git submodule).
# Fly app names are globally unique; nothing else in this repo depends on the name.
app = "bhgrafana"
primary_region = "sin"
swap_size_mb = 1024

# ORG is the NATS username Vector uses for the Fly platform log/metric streams;
# it must match the org the readonly ACCESS_TOKEN secret is scoped to.
[env]
  ORG = "beehive-gaming"

[vm]
  size = "shared-cpu-8x"
  memory = "2gb"

[mounts]
  source = "data"
  destination = "/data"

# Grafana UI over Flycast: http://<app>.flycast/ (port 80 -> 3000).
# No public IPs — the private network IS the auth boundary (Grafana is anonymous admin).
[http_service]
  internal_port = 3000
  # flycast serves plain HTTP only — an https redirect would dead-end (no TLS on the private net)
  force_https = false

# OTLP trace ingest (HTTP). Point services at the *base* endpoint:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://<app>.flycast:10428/insert/opentelemetry
# The SDK appends /v1/traces itself — a wrong base means silent 404s.
[[services]]
  protocol = "tcp"
  internal_port = 10428

  [[services.ports]]
    port = 10428
