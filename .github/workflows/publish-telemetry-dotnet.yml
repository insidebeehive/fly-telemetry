name: publish-telemetry-dotnet

on:
  push:
    tags: ["dotnet-telemetry-v*"]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  PROJECT: telemetry-dotnet/src/Beehive.Telemetry/Beehive.Telemetry.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GITHUB_TOKEN pushes to nuget.pkg.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # The package targets net8.0; the 8.0 runtime lets the tests run natively.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Tag must match the csproj Version
        run: |
          VERSION=$(dotnet msbuild "$PROJECT" -getProperty:Version | tr -d '[:space:]')
          echo "csproj version: $VERSION / tag: $GITHUB_REF_NAME"
          test "dotnet-telemetry-v$VERSION" = "$GITHUB_REF_NAME"

      - run: dotnet build telemetry-dotnet -c Release
      - run: dotnet test telemetry-dotnet -c Release --no-build
      - run: dotnet pack "$PROJECT" -c Release --no-build -o out

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "out/*.nupkg"
          --source https://nuget.pkg.github.com/insidebeehive/index.json
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      # Optional second registry. Secrets cannot be used in an `if:` expression, so the
      # presence check happens in a step that sets an output instead.
      - name: Is a nuget.org key configured?
        id: nugetorg
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "NUGET_API_KEY not set — skipping the nuget.org push."
          fi

      - name: Publish to nuget.org
        if: steps.nugetorg.outputs.configured == 'true'
        run: >
          dotnet nuget push "out/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
