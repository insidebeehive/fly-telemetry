name: publish-telemetry

on:
  push:
    tags: ["telemetry-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "telemetry-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Syntax check
        run: |
          for f in index.js register.js src/*.js; do node --check "$f"; done
          node --check register.mjs
      - name: "Smoke: activation is inert off-Fly, logger builds"
        run: |
          npm install --no-audit --no-fund
          node --import ./register.mjs -e "console.log('boot ok')"
          node --require ./register.js -e "console.log('boot ok')"
          node -e "const {logger}=require('./index.js'); logger.info('smoke', {ok:true}); logger.error('smoke err', {err: new Error('boom')}); logger.audit('smoke.audit', {actor:'ci'})"
          LOG_LEVEL=error node -e "const {logger}=require('./index.js'); logger.audit('audit survives LOG_LEVEL=error') "
      - run: npm publish
        env:
          # npm automation token for the insidebeehive org on npmjs.com,
          # stored as a repo/org Actions secret named NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
