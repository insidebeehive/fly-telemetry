# ClickStack trial (see README.md and ../DEVLOG.md 2026-08-30).
# Deploy from THIS directory so flyctl picks up the local Dockerfile.
app = "bhcs"
primary_region = "sin"
swap_size_mb = 2048

# ClickHouse wants a graceful stop (flush + finish merges); Fly's default 5s
# forces crash recovery on the next boot. 120s makes deploys boring.
kill_timeout = "120s"

[env]
  # NATS username for the Fly platform streams; must match the org the readonly
  # ACCESS_TOKEN secret is scoped to.
  ORG = "beehive-gaming"

  # The Fly NATS bridge. Flip either and restart — no rebuild needed.
  # Logs are ON because no SDKs are deployed yet; set to "false" once services
  # ship their own logs (or leave on — it also covers uninstrumented apps and
  # Fly-side lines no SDK can emit).
  INGEST_NATS_LOGS = "true"
  # Platform metrics can ONLY come from NATS — no SDK produces fly_* series.
  INGEST_NATS_METRICS = "true"

  # Adds the NATS-metrics scrape pipeline to the collector.
  CUSTOM_OTELCOL_CONFIG_FILE = "/etc/bhcs/otel-custom.config.yaml"

  # Caps the HyperDX Node processes so ClickHouse and Mongo keep their budget.
  NODE_OPTIONS = "--max-old-space-size=1024"

  # The image builds FRONTEND_URL as ${HYPERDX_APP_URL}:${HYPERDX_APP_PORT}.
  HYPERDX_APP_URL = "http://bhcs.flycast"

[vm]
  size = "shared-cpu-8x"
  memory = "8gb"

[mounts]
  source = "data"
  destination = "/data"

# The collector's health endpoint. The upstream entrypoint already exits the
# container if ClickHouse, Mongo, the collector or the app dies; this catches
# the collector being alive but unhealthy — i.e. ingestion silently broken.
[checks]
  [checks.collector]
    type = "http"
    port = 13133
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"

# NO public IPs in phase 1 — deploy with --flycast and verify with `fly ips list`.
# Ports are exposed 1:1 rather than via [http_service] on 80, because HyperDX
# builds its own URLs from the app/API ports and a rewrite would break them.

# HyperDX UI.
[[services]]
  protocol = "tcp"
  internal_port = 8080
  [[services.ports]]
    port = 8080

# HyperDX API — the browser calls this directly, so it must be reachable too.
[[services]]
  protocol = "tcp"
  internal_port = 8000
  [[services.ports]]
    port = 8000

# OTLP ingest (http/protobuf). SDKs: OTEL_EXPORTER_OTLP_ENDPOINT=http://bhcs.flycast:4318
[[services]]
  protocol = "tcp"
  internal_port = 4318
  [[services.ports]]
    port = 4318

# OTLP ingest (gRPC).
[[services]]
  protocol = "tcp"
  internal_port = 4317
  [[services.ports]]
    port = 4317
